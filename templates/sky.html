<!DOCTYPE html>
<html>
<head>
  <title>Sky</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="hero sky-hero">
    <div class="tagline">Your sky journal</div>
    <h1>Sky</h1>
    <a href="/journal" class="tab inactive full-width">Journal</a>
    <a href="/brighter" class="tab inactive full-width">✨ Brighter</a>

    <div class="sky-frame">
      <svg viewBox="0 0 1000 700">
        {% for c in constellations %}
          <polyline points="{{ c.points }}" fill="none" stroke="{{ c.color }}"
                    stroke-width="1.5" opacity="0.35"></polyline>
        {% endfor %}

        {% for entry in entries %}
          <a href="/entries/{{ entry.id }}">
            <g class="star" transform="translate({{ entry.x }},{{ entry.y }})">
              <circle r="20" fill="{{ entry.mood.color }}" opacity="0.2"></circle>
              <circle r="8" fill="{{ entry.mood.color }}"></circle>
            </g>
          </a>
        {% endfor %}
      </svg>

      {% if not entries %}
        <p class="paper-text sky-empty">No stars yet. <a href="/new">Write your first memory →</a></p>
      {% endif %}
    </div>

  </div>
</body>
</html>
