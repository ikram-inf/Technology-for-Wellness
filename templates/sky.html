<!DOCTYPE html>
<html>
<head>
  <title>Your sky</title>
  <style>
    body { background: #0a0d1f; margin: 0; }
    svg { width: 100%; height: 100vh; display: block; }
    .star { cursor: pointer; }
    .star:hover circle { opacity: 0.8; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1000 700">
    {% for c in constellations %}
        <polyline points="{{ c.points }}" fill="none" stroke="{{ c.color }}"
                stroke-width="1.5" opacity="0.35"></polyline>
    {% endfor %}

    {% for entry in entries %}
        <a href="/entries/{{ entry.id }}">
        <g class="star" transform="translate({{ entry.x }},{{ entry.y }})">
            <circle r="12" fill="{{ entry.mood.color }}" opacity="0.2"></circle>
            <circle r="5" fill="{{ entry.mood.color }}"></circle>
        </g>
        </a>
    {% endfor %}
    </svg>
</body>
</html>
